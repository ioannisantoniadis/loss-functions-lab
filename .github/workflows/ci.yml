name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync

      - name: Lint the tests
        run: uv run ruff check tests

      - name: Numerical checks of the book's claims
        run: uv run pytest -q
